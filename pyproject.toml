[project]
name = "resume"
version = "0.1.0"
description = "个人求职投递件与投递进度"
requires-python = ">=3.13"
dependencies = [
    "patchright",
    "pyyaml",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest",
    "ruff>=0.16.8",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 140
src = ["src", "tests"]
extend-exclude = [".agents", "screen", "resume"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
