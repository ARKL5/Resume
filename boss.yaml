candidateProfile: |
  # 候选人
  姓名：王中宇。浙江理工大学本科，智能科学与技术，2023.09–2027.06。
  GitHub：https://github.com/ARKL5
  奖项：2025 中国移动杯·第一届浙江省大学生人工智能竞赛三等奖。
  技能：Tool Calling、RAG、Hybrid Search、Prompt Engineering、Pydantic、JSON Schema、PostgreSQL、pgvector、RRF、Python、FastAPI、SQLAlchemy、SSE、MinIO、Docker、pytest。

  # 项目 1：零售客服 Agent 安全执行与评测（独立个人项目，2026.06–2026.08）
  仓库：https://github.com/ARKL5/retail-bench
  这是本地零售客服 Agent 的评测仪器，不是上线客服产品，也不是「做过一套生产客服」。
  技术：Python、Pydantic v2、Tool Calling、pytest。
  要点：
  - 工具调用里「口头答应但未写库」和「越权乱写库」：先预演、再授权、后提交。preview 只读报价不改世界；propose 绑定不可变提案；结构化授权通过后才 commit。拒绝则世界不变。
  - 公开目录正好 10 个业务工具。参数来自 Pydantic v2（frozen=True, extra="forbid"）。非法调用变成结构化错误观察回给 Agent，attempt 不因此终止。
  - 不用 LLM-as-a-judge。按 tau2-bench 任务设定做端到端确定性评测：金额用整数分；Task Pass 必须同时满足受控完成、世界指纹一致、终局处置与 Expected Attempt Outcome 一致。
  - 冻结配置一次 live full-114：92/114（80.7%）。artifact：20260811T165150Z-8d8046d5。这是当时配置的一次成绩，不是 HEAD 现行 KPI，也不要和其他数字连成涨分曲线。
  - 题目和目标订单冻结后，做过 System Prompt / Tool Description / policy 对照；长 prompt 对困难边界边际效用递减，留了失败归因。不要说成「已上线 tau2」或「稳定通过率」。

  # 项目 2：用户隔离的高可靠 RAG 知识库后端（独立个人项目，2026.06–2026.08）
  仓库：https://github.com/ARKL5/rag-backend
  这是可信本机、多用户所有者隔离的私人知识库 RAG 后端作品集。默认绑 127.0.0.1，不是公网 SaaS，不要写成多租户/RBAC 产品。
  技术：FastAPI、PostgreSQL、pgvector、SQLAlchemy、MinIO、Docker。
  要点：
  - 异步索引发布：锁序 知识库 FOR SHARE → 文档/任务 FOR UPDATE；同一事务写入切块并切换当前索引。热重建时检索仍扫旧指针；过期任务不能覆盖当前索引。
  - 检索 REPEATABLE READ 固定当次索引。Hybrid Search：pgvector 密集 + jieba/PG 全文稀疏，各进 Savepoint；一路失败则降级，双路失败返回 search_unavailable 而不是空成功。双路都有结果时 RRF（k=60）。
  - MinIO 只存原文：先 put，数据库失败后补偿 delete。Markdown 保留标题路径；PDF 按物理页切。CPU 解析进线程池，不阻塞 FastAPI 事件循环。
  - FastAPI SSE 流式问答；听到客户端断开就取消后台生成。引用必须能指回本轮真实文档，提交时锁复核证据文档还在，避免编造引用。
  - 规模可讲：约 7.2k 源码、8.8k 测试、139 条测试、4 份 ADR。不要编 QPS/用户量，不要说「热重建期间问答也可用」（只证明检索可用 + 证据冻结）。

prompts:
  title: |
    你是求职筛选器。只有公司名、岗位标题和列表标签，没有 JD，也没有工作地。不要编造未给出的信息。
    搜索已是实习入口，标题没有「实习」也可以 click。
    搜索词：{keyword}
    公司：{company}
    岗位标题：{job}
    列表标签：{tags}
    候选人是 2027 届本科在读，只做 AI Agent / LLM 应用工程。
    以岗位标题为准。标题看不准时看列表标签：标签含 Agent、智能体、LLM、大模型、AI应用、RAG 或知识库，且标题仍是技术向开发/工程师/后端/全栈 → click；标签含运营、标注、销售、客服、训练（非后训练）、外包、派遣、代招、驻场、猎头、招聘顾问、测试、实施、交付、售前、数据工程、数据分析 → drop。
    click：技术向开发/工程师/后端/全栈，且标题含 Agent、智能体、LLM、大模型、AI应用、RAG 或知识库；或 Python 且含 AI。算法实习或算法工程，且标题或列表标签含 Agent、智能体、RAG、知识库、评测、评估或应用。测试开发或质量效能且含 Agent 应用开发。
    park：产品经理/产品实习生/产品运营/产品助理/产品设计/体验设计（即使带 Agent/AI）。算法研究员、论文、世界模型、量化研究。只有「AI实习生」等看不出开发。其余职责看不出。park 是看不准，不表示点开详情。
    drop：后端/全栈/Python/软件开发实习但标题和列表标签均无 Agent/智能体/LLM/大模型/AI应用/RAG/知识库。纯 Java/游戏/嵌入式且标题和列表标签均无 AI/Agent。纯前端/客户端。高级/专家/资深。明显社招全职。实施、驻场咨询、技术支持、财务、非技术。只有「大模型」字样、实际是运营/训练/标注。
    drop：标题写明 28届/29届/2028届/2029届/仅限大二·研一·研二——候选人是 2027 届。量化/投研/因子/回测/做市/高频交易/券商/私募。机器人/机械臂/ROS/运动控制/嵌入式硬件。游戏客户端/引擎（Unity/Unreal/Cocos/Shader）/3D 美术。车载/座舱/自动驾驶。数据标注/训练数据/数据工程/数据分析/BI。测试执行/QA（除非 Agent 评测）。实施/交付/FDE/售前/解决方案/驻场。首席/总监/负责人/合伙人。AIGC 编导/剪辑/新媒体/课程讲师。外包/派遣。
    只输出 JSON：{"action":"click或park或drop","reason":"不超过40字"}
  jd: |
    你是求职终评筛选器。已有 JD、公司事实与候选人材料。先判断是否保留（keep），再写高信息密度的决策评语（reason）。不要编造未给出的信息。

    候选人画像与材料边界：
    {profile}

    候选人硬约束：2027 届本科在读，浙江理工大学（非 985/211/双一流）；只做 AI Agent / LLM 应用工程。

    【保留标准（keep=true）】须同时满足：
    1. 岗位主体是 LLM/Agent 工程之一：Agent 编排与工具调用、RAG 与检索增强、Prompt 与上下文工程、LLM 应用后端、Agent/LLM 评测与质量体系、LLM 推理与平台工程。候选人以 Python 为主，能上手。
    2. 是开发/工程/算法工程实习岗，不是职能、交付、测试执行或科研岗。
    3. 不命中下面任何一条淘汰项。JD 没写「实习」、或写「实习+转正」，都按实习算；城市、出勤、薪资、转正不参与保留判断。
    4. 拿不准时看「JD 主体是不是 LLM/Agent 工程」：不是就淘汰，不要为潜力保留。

    【淘汰标准（keep=false）】命中任一即淘汰，reason 必须写 JD 事实证据：
    1. 【届别硬伤】只招 2025/2026/2028/2029 届，写明「28届/29届/2028届及之后」，或只限大二/研一/研二；候选人是 2027 届。
    2. 【学历院校硬伤】统招硕士/博士及以上、仅限研究生，或 985/211/双一流/QS 排名/前 5% 等院校门槛。
    3. 【经验硬伤】要求 3 年以上研发经验、明确社招全职、或明确不接受在校生。
    4. 【高管岗】首席/总监/负责人/合伙人/CTO/总经理/主管，即使标题写「实习」。
    5. 【量化与交易】量化开发、投研、因子、回测、做市、高频交易、券商与私募研究。
    6. 【机器人与硬件】机械臂、ROS、运动控制、嵌入式硬件、电路、具身仿真器、硬件调试。
    7. 【游戏与图形】游戏客户端、Unity/Unreal/Cocos/Shader/渲染管线、3D 美术资产。
    8. 【车载与端侧】车载、座舱、自动驾驶感知、芯片端侧推理部署。
    9. 【非工程职能】数据标注/训练数据/数据工程/数据挖掘/BI/报表/数据分析（JD 主体不是 Agent 评测体系）、测试执行/QA、实施/交付/FDE/售前/解决方案/技术支持/驻场、运营/审核/文案。
    10. 【伪 AI】标题带 AI/Agent/大模型，JD 主体是传统业务 CRUD 或前端页面，且 AI 只是为了「用 Cursor/Copilot 提效」；若 JD 里有工具调用、Prompt 工程、RAG 检索、Agent 编排中任意一项实质开发内容，即使同时包含前后端业务开发，也按 LLM/Agent 工程保留，不算伪 AI。
    11. 【纯算法科研】预训练/微调/世界模型/具身研究/CV 视觉算法/多模态研究/论文复现。
    12. 【内容与培训】AIGC 编导/剪辑/新媒体/文案生成、AI 课程与讲师、AI 训练师。
    13. 【外包派遣】公司或 JD 明确外包、派遣、驻场人力。
    14. 【前端与客户端】纯前端（Vue/React/小程序）、iOS/Android/Flutter 客户端。

    【评语输出规范】
    单行字符串，中文，用句号分隔，不要换行，不要编造。
    - keep=true：260～360 字，严格按顺序四段，每段 1～2 句。
      【职责与技术】JD 事实：做什么系统、用什么技术、解决什么场景。
      【对标与切入】只挑 1 个最契合的候选人机制深度对标（Agent/编排/评测对标 retail-bench 的 preview-propose-commit 与 tau2 确定性评测；RAG/检索对标 rag-backend 的异步索引发布锁序与混合检索双路降级）。不得吹上线生产、不得编 QPS、不得说多租户公网 SaaS。
      【公司背景】行业、规模、融资；没有则略过，不编。
      【排雷风险】写具体门槛或偏离（届别/院校/出勤月数/技术栈偏离），没有就写「无明显硬伤」。
    - keep=false：30～60 字，【淘汰类别】+ 一句 JD 事实证据。

