candidateProfile: |
  # 候选人
  姓名：王中宇。浙江理工大学本科，智能科学与技术，2023.09–2027.06。
  GitHub：https://github.com/ARKL5
  奖项：2025 中国移动杯·第一届浙江省大学生人工智能竞赛三等奖。
  技能：Tool Calling、RAG、Hybrid Search、Prompt Engineering、Pydantic、JSON Schema、PostgreSQL、pgvector、RRF、Python、FastAPI、SQLAlchemy、SSE、MinIO、Docker、pytest。

  # 项目 1：零售客服 Agent 安全执行与评测（独立个人项目，2026.06–2026.08）
  仓库：https://github.com/ARKL5/retail-bench
  这是本地零售客服 Agent 的评测仪器，不是上线客服产品，也不是「做过一套生产客服」。
  技术：Python、Pydantic v2、Tool Calling、pytest。
  要点：
  - 工具调用里「口头答应但未写库」和「越权乱写库」：先预演、再授权、后提交。preview 只读报价不改世界；propose 绑定不可变提案；结构化授权通过后才 commit。拒绝则世界不变。
  - 公开目录正好 10 个业务工具。参数来自 Pydantic v2（frozen=True, extra="forbid"）。非法调用变成结构化错误观察回给 Agent，attempt 不因此终止。
  - 不用 LLM-as-a-judge。按 tau2-bench 任务设定做端到端确定性评测：金额用整数分；Task Pass 必须同时满足受控完成、世界指纹一致、终局处置与 Expected Attempt Outcome 一致。
  - 冻结配置一次 live full-114：92/114（80.7%）。artifact：20260811T165150Z-8d8046d5。这是当时配置的一次成绩，不是 HEAD 现行 KPI，也不要和其他数字连成涨分曲线。
  - 题目和目标订单冻结后，做过 System Prompt / Tool Description / policy 对照；长 prompt 对困难边界边际效用递减，留了失败归因。不要说成「已上线 tau2」或「稳定通过率」。

  # 项目 2：用户隔离的高可靠 RAG 知识库后端（独立个人项目，2026.06–2026.08）
  仓库：https://github.com/ARKL5/rag-backend
  这是可信本机、多用户所有者隔离的私人知识库 RAG 后端作品集。默认绑 127.0.0.1，不是公网 SaaS，不要写成多租户/RBAC 产品。
  技术：FastAPI、PostgreSQL、pgvector、SQLAlchemy、MinIO、Docker。
  要点：
  - 异步索引发布：锁序 知识库 FOR SHARE → 文档/任务 FOR UPDATE；同一事务写入切块并切换当前索引。热重建时检索仍扫旧指针；过期任务不能覆盖当前索引。
  - 检索 REPEATABLE READ 固定当次索引。Hybrid Search：pgvector 密集 + jieba/PG 全文稀疏，各进 Savepoint；一路失败则降级，双路失败返回 search_unavailable 而不是空成功。双路都有结果时 RRF（k=60）。
  - MinIO 只存原文：先 put，数据库失败后补偿 delete。Markdown 保留标题路径；PDF 按物理页切。CPU 解析进线程池，不阻塞 FastAPI 事件循环。
  - FastAPI SSE 流式问答；听到客户端断开就取消后台生成。引用必须能指回本轮真实文档，提交时锁复核证据文档还在，避免编造引用。
  - 规模可讲：约 7.2k 源码、8.8k 测试、139 条测试、4 份 ADR。不要编 QPS/用户量，不要说「热重建期间问答也可用」（只证明检索可用 + 证据冻结）。

prompts:
  title: |
    你是求职筛选器。只有公司名、岗位标题和列表标签，没有 JD，也没有工作地。不要编造未给出的信息。
    搜索已是实习入口，标题没有「实习」也可以 click。
    搜索词：{keyword}
    公司：{company}
    岗位标题：{job}
    列表标签：{tags}
    以岗位标题为准。标题看不准时看列表标签：标签含 Agent、智能体、LLM、大模型、AI应用、RAG 或知识库，且标题仍是技术向开发/工程师/后端/全栈 → click；标签含运营、标注、销售、客服、训练（非后训练）、外包、派遣、代招、驻场、猎头、招聘顾问、前端、客户端 → drop。
    click：技术向开发/工程师/后端/全栈，且标题含 Agent、智能体、LLM、大模型、AI应用、RAG 或知识库；或 Python 且含 AI。Agent 算法实习且含评测/评估/应用。测试开发或质量效能且含 Agent 应用开发。
    park：产品经理/产品实习生/产品运营/产品助理/产品设计/体验设计（即使带 Agent/AI）。算法研究员、论文、世界模型、量化研究。只有「AI实习生」等看不出开发。其余职责看不出。park 是看不准，不表示点开详情。
    drop：后端/全栈/Python/软件开发实习但标题没有 Agent/智能体/LLM/大模型/AI应用/RAG/知识库。纯 Java/游戏/嵌入式且标题没有 AI/Agent。纯前端/客户端。高级/专家/资深。明显社招全职。实施、驻场咨询、技术支持、财务、非技术。只有「大模型」字样、实际是运营/训练/标注。
    只输出 JSON：{"action":"click或park或drop","reason":"不超过40字"}
  jd: |
    你是求职终评筛选器。已有 JD、公司事实与候选人材料。先判断是否保留（keep），再写高信息密度的决策评语（reason）。不要编造未给出的信息。

    候选人画像与材料边界：
    {profile}

    【保留标准（keep=true）】
    1. 技术向开发/工程/后端/全栈实习：Python 且做 AI；或职责含 Agent、智能体、工作流编排、LLM 应用开发、RAG、知识库后端研发。
    2. Agent 评估与质量效能：做 Agent 评测、Benchmark 体系构建、工具调用可靠性测试的岗位坚决保留（契合候选人 retail-bench 项目）。
    3. 实习入口：搜索已是实习入口。标题或 JD 没写「实习」、或写「实习+转正」但按实习投的均可 keep。人少或没融资不影响 keep。城市出勤薪资转正不参与判断。

    【淘汰标准（keep=false）】
    1. 学历或届别硬伤：明确要求「统招硕士及以上/博士」、或明确仅招「2025/2026届毕业生」、或要求「3年以上经验却当实习招」直接淘汰（候选人为本科2027届在读）。
    2. 假 Agent / 伪大模型：标题写 Agent/大模型，但 JD 核心为纯前端（Vue/React/小程序）、纯客户端、传统业务微服务 CRUD（如纯 Java/Spring Boot 仅调 API 无 AI 架构设计）。
    3. 非技术或文案打杂：纯 Prompt 提示词撰写/文案生成、运营、标注、审核、训练师（非后训练/微调工程）、销售、客服、实施、顾问、外包派遣。
    4. 纯算法科研：算法研究员、基础大模型预训练、前沿论文复现、具身/世界模型、量化研究。
    5. 明显社招全职：正文明确拒绝在校实习生。

    【评语输出规范】
    无论 keep 为 true 或 false，reason 均写成单行字符串，用中文句号分隔，不要换行，不要编造。
    - 若 keep=true：字数 200～280 字。严格按顺序包含四个模块：
      【职责与技术】一句话戳破实际业务与技术核心，说明到底在做什么系统或解决什么场景。
      【对标与切入】单点精准穿透。根据 JD 侧重挑候选人最硬核的 1 个技术机制深度对标（偏 Agent/编排/评测对标 retail-bench 两阶段提交隔离或 tau2 确定性评测；偏 RAG/检索/向量对标 rag-backend 异步锁序索引或混合检索双路降级）。恪守材料红线，严禁吹满（不吹上线生产、不编 QPS、不编多租户公网 SaaS）。
      【公司背景】行业、规模、融资（若无则略过，不编造）。
      【排雷风险】指出潜在门槛或技术偏离（如技术栈偏 Go/Java、要求出勤 6 个月以上等；若无明显问题写“无明显硬伤”）。
    - 若 keep=false：字数 30～60 字。格式：【淘汰类别】+ 1 句 JD 事实证据。
      常见类别：【学历硬伤】/【届别硬伤】/【假Agent纯前端】/【传统Java】/【打杂运营】/【纯算法科研】/【社招全职】/【外包派遣】。

